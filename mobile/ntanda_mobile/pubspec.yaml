name: ntanda
description: Advanced LMS Mobile App for Ntanda.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_bloc: ^8.1.3
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  smooth_page_indicator: ^1.1.0
  animate_do: ^3.3.4
  lottie: ^3.0.0
  cached_network_image: ^3.3.0
  provider: ^6.1.1
  video_player: ^2.8.2
  camera: ^0.10.5+5
  local_auth: ^2.1.8
  path_provider: ^2.1.1
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
